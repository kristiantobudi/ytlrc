rust:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "Cargo.toml"
          - "Cargo.lock"

extension:
  - changed-files:
      - any-glob-to-any-file:
          - "extension/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - "packaging/**"
          - "flake.nix"
          - "build.sh"
          - "build.ps1"
          - "ytlrc.cmd"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*test*.rs"
