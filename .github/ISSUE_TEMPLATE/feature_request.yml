name: Feature request
description: Suggest an idea or improvement for ytlrc.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please explain the problem first, then the
        solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
      placeholder: I listen to long live streams and ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like ytlrc to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have tried.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Lyrics lookup / parsing
        - TUI / themes / keybindings
        - Browser extension
        - Platform support / packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions first.
          required: true
