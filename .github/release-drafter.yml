name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Added"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Fixed"
    labels:
      - "bug"
      - "fix"
  - title: "🔒 Security"
    labels:
      - "security"
  - title: "📦 Packaging / CI"
    labels:
      - "packaging"
      - "ci"
  - title: "📝 Documentation"
    labels:
      - "documentation"
  - title: "🧹 Maintenance"
    labels:
      - "chore"
      - "refactor"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
      - "feature"
  patch:
    labels:
      - "patch"
      - "bug"
      - "fix"
  default: patch
template: |
  ## What's changed

  $CHANGES

  **Full diff**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
exclude-labels:
  - "skip-changelog"
