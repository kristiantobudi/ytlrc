ShortDescription: Synced YouTube lyrics in your terminal
Description: >-
  ytlrc shows synced YouTube lyrics in your terminal. A tiny Rust daemon plus
  a Chrome/Edge extension detects the song playing on YouTube or YouTube
  Music, looks it up on LRCLIB, and highlights the current line in a
  terminal UI as the music plays. No API keys, no account, no audio
  fingerprinting.
