[package]
name = "ytlrc"
version = "0.1.0"
edition = "2021"
description = "YouTube now-playing lyrics daemon + terminal UI"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
directories = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
