[package]
name = "ytlrc"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Synced YouTube lyrics in your terminal: a lightweight Rust daemon plus browser extension"
authors = ["ytlrc contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/kristiantobudi/ytlrc"
keywords = ["youtube", "lyrics", "lrc", "tui", "music"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1"
axum = "0.8"
directories = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
